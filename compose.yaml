# cp .env.example .env → docker compose up -d --build
# 端口 127.0.0.1:8600；进度在 asl-data 卷。
services:
  asl:
    build: .
    image: agent-security-lab
    container_name: agent-security-lab
    ports:
      - "127.0.0.1:8600:8600"
    env_file:
      - path: .env
        required: false
    volumes:
      - asl-data:/app/data/runtime
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  asl-data:
    name: asl-data
