[project]
name = "agent-security-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pis10", email = "1114749518@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.12",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
agent-security-lab = "agent_security_lab:main"
asl = "agent_security_lab.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
